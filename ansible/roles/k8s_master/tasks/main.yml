- name: 필수 패키지 설치
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: yes

- name: 키링 디렉토리 생성
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: 쿠버네티스 GPG 키 다운로드
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: yes

- name: 쿠버네티스 APT 저장소 추가
  apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /'
    state: present
    filename: kubernetes

- name: (마스터) 쿠버네티스 구성요소 설치
  apt:
    name:
      - containerd
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: 패키지 버전 홀드
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: 필요한 커널 모듈 로드 (overlay, br_netfilter)
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: 커널 파라미터 설정 (IP 포워딩 등)
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

- name: containerd 설정 디렉토리 생성
  file:
    path: /etc/containerd
    state: directory

- name: containerd 기본 설정 생성
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: SystemdCgroup 활성화 (containerd)
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: (마스터) kubeadm init 실행
  shell: kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=NumCPU
  args:
    creates: /etc/kubernetes/admin.conf
  
- name: (마스터) kubeconfig 파일 생성
  shell: |
    mkdir -p /root/.kube
    cp -i /etc/kubernetes/admin.conf /root/.kube/config
    chown root:root /root/.kube/config
    chmod 600 /root/.kube/config
  args:
    creates: /root/.kube/config

- name: (마스터) API 서버가 준비될 때까지 대기
  shell: kubectl get nodes
  environment:
    KUBECONFIG: /root/.kube/config
  retries: 30
  delay: 10
  register: api_ready
  until: api_ready.rc == 0
  changed_when: false

- name: (마스터) Helm 설치
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: (마스터) Helm 저장소 업데이트
  shell: /usr/local/bin/helm repo add cilium https://helm.cilium.io && /usr/local/bin/helm repo update
  environment:
    KUBECONFIG: /root/.kube/config
  ignore_errors: yes

- name: (마스터) CNI (Cilium) Helm으로 설치/업그레이드
  shell: |
    /usr/local/bin/helm upgrade --install cilium cilium/cilium --namespace kube-system \
      --set kubeProxyReplacement=false
  environment:
    KUBECONFIG: /root/.kube/config

- name: (마스터) Cilium 대기
  pause:
    seconds: 15

- name: (마스터) Cilium 상태 확인
  shell: kubectl get pods -n kube-system -l k8s-app=cilium -o wide
  environment:
    KUBECONFIG: /root/.kube/config
  changed_when: false

- name: (마스터) 워커 노드 join 토큰 생성 및 저장
  shell: kubeadm token create --print-join-command
  environment:
    KUBECONFIG: /root/.kube/config
  register: kubeadm_join_command

- name: (마스터) join 명령어를 팩트로 저장
  set_fact:
    join_command: "{{ kubeadm_join_command.stdout }}"
