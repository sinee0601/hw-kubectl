apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-32200060-1
      
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://gitlab.example.com'
            postgresql['shared_buffers'] = "256MB"
            prometheus_monitoring['enable'] = false
            sidekiq['max_concurrency'] = 10
            puma['worker_processes'] = 0
            gitlab_rails['env'] = 
{"MALLOC_CONF" => "dirty_decay_ms:1000,muzzy_decay_ms:1000"}
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: default
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: gitlab